/* ==========================================================================
   MATERIAL DESIGN 3 — LIGHT THEME (DEFAULT)
   ========================================================================== */
:root, .light {
  --md-sys-color-primary: rgb(0 103 124);
  --md-sys-color-surface-tint: rgb(0 103 124);
  --md-sys-color-on-primary: rgb(255 255 255);
  --md-sys-color-primary-container: rgb(0 172 205);
  --md-sys-color-on-primary-container: rgb(0 58 71);
  --md-sys-color-secondary: rgb(30 30 30);
  --md-sys-color-on-secondary: rgb(255 255 255);
  --md-sys-color-secondary-container: rgb(51 51 51);
  --md-sys-color-on-secondary-container: rgb(156 155 155);
  --md-sys-color-tertiary: rgb(38 39 125);
  --md-sys-color-on-tertiary: rgb(255 255 255);
  --md-sys-color-error: rgb(179 33 0);
  --md-sys-color-on-error: rgb(255 255 255);
  --md-sys-color-error-container: rgb(255 218 212);
  --md-sys-color-on-error-container: rgb(65 0 0);
  --md-sys-color-background: rgb(245 250 253);
  --md-sys-color-on-background: rgb(23 28 30);
  --md-sys-color-surface: rgb(249 249 249);
  --md-sys-color-on-surface: rgb(27 27 27);
  --md-sys-color-surface-variant: rgb(224 227 227);
  --md-sys-color-on-surface-variant: rgb(68 71 72);
  --md-sys-color-outline: rgb(116 120 120);
  --md-sys-color-outline-variant: rgb(196 199 199);
  --md-sys-color-surface-container-lowest: rgb(255 255 255);
  --md-sys-color-surface-container-low: rgb(243 243 243);
  --md-sys-color-surface-container: rgb(238 238 238);
  --md-sys-color-surface-container-high: rgb(232 232 232);
  --md-sys-color-surface-container-highest: rgb(226 226 226);
  --md-extended-color-custom-color1-color: rgb(0 108 77);
  --md-extended-color-custom-color1-color-container: rgb(47 175 131);
  --md-extended-color-custom-color1-on-color-container: rgb(0 59 41);
  --kv-accent: rgb(0 172 205);
  --r: 0px;
}

/* ==========================================================================
   MATERIAL DESIGN 3 — DARK THEME
   ========================================================================== */
.dark {
  --md-sys-color-primary: rgb(84 214 248);
  --md-sys-color-on-primary: rgb(0 54 66);
  --md-sys-color-primary-container: rgb(0 172 205);
  --md-sys-color-on-primary-container: rgb(0 58 71);
  --md-sys-color-error: rgb(255 180 164);
  --md-sys-color-on-error: rgb(99 14 0);
  --md-sys-color-error-container: rgb(255 86 50);
  --md-sys-color-on-error-container: rgb(38 2 0);
  --md-sys-color-background: rgb(15 20 22);
  --md-sys-color-on-background: rgb(222 227 230);
  --md-sys-color-surface: rgb(19 19 19);
  --md-sys-color-on-surface: rgb(226 226 226);
  --md-sys-color-surface-variant: rgb(68 71 72);
  --md-sys-color-on-surface-variant: rgb(196 199 199);
  --md-sys-color-outline: rgb(142 145 146);
  --md-sys-color-outline-variant: rgb(68 71 72);
  --md-sys-color-surface-container-lowest: rgb(14 14 14);
  --md-sys-color-surface-container-low: rgb(27 27 27);
  --md-sys-color-surface-container: rgb(31 31 31);
  --md-sys-color-surface-container-high: rgb(42 42 42);
  --md-sys-color-surface-container-highest: rgb(53 53 53);
  --kv-accent: rgb(84 214 248);
}

/* ==========================================================================
   BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Hedley New', 'Hind', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  background-color: var(--md-sys-color-background);
  color: var(--md-sys-color-on-background);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ==========================================================================
   HEADER
   ========================================================================== */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background-color: var(--md-sys-color-surface-container-lowest);
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
  min-height: 56px;
  flex-shrink: 0;
}

.brand-logo {
  height: 28px;
  width: auto;
  display: block;
}

.app-header-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--md-sys-color-on-surface-variant);
  text-align: right;
}

/* ==========================================================================
   MAIN SCROLL AREA
   ========================================================================== */
main {
  flex: 1;
  overflow-y: auto;
  padding: 12px 12px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ==========================================================================
   CARDS / SECTIONS
   ========================================================================== */
.kv-card {
  background-color: var(--md-sys-color-surface-container-lowest);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--r);
  padding: 12px;
}

.kv-card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--md-sys-color-on-surface-variant);
  margin-bottom: 8px;
}

/* ==========================================================================
   STATUS DA SELEÇÃO
   ========================================================================== */
#selStatus {
  background-color: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--r);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--md-sys-color-on-surface-variant);
  min-height: 40px;
  display: flex;
  align-items: center;
}

#selStatus .accent { color: var(--kv-accent); font-weight: 600; }
#selStatus .val { color: var(--md-sys-color-on-surface); }

/* ==========================================================================
   CHECKBOXES / RADIO — PROP LIST
   ========================================================================== */
.prop-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px 8px;
}

.kv-check-label {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  font-size: 13px;
  color: var(--md-sys-color-on-surface);
  cursor: pointer;
  padding: 4px 0;
}

.kv-check-label input[type="checkbox"],
.kv-check-label input[type="radio"] {
  accent-color: var(--kv-accent);
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  cursor: pointer;
}

.kv-radio-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.kv-radio-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--md-sys-color-on-surface);
  cursor: pointer;
  min-height: 36px;
}

.kv-radio-label input[type="radio"] {
  accent-color: var(--kv-accent);
  width: 16px;
  height: 16px;
  cursor: pointer;
}

/* ==========================================================================
   DIVISOR INTERNO
   ========================================================================== */
.kv-divider {
  border: none;
  border-top: 1px solid var(--md-sys-color-outline-variant);
  margin: 8px 0;
}

/* ==========================================================================
   CAMPOS DE ENTRADA
   ========================================================================== */
.kv-input {
  width: 100%;
  background-color: var(--md-sys-color-surface-container-low);
  color: var(--md-sys-color-on-surface);
  border: 1px solid var(--md-sys-color-outline);
  border-radius: var(--r);
  min-height: 40px;
  padding: 0 12px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}

.kv-input:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 2px;
  border-color: var(--md-sys-color-primary);
}

.kv-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--md-sys-color-on-surface-variant);
  margin-bottom: 4px;
}

.kv-helper {
  font-size: 11px;
  color: var(--md-sys-color-on-surface-variant);
  margin-bottom: 6px;
  line-height: 1.4;
}

/* ==========================================================================
   BOTÕES
   ========================================================================== */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  min-height: 44px;
  background-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  border: none;
  border-radius: var(--r);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
}

.btn-primary:hover { opacity: 0.88; }
.btn-primary:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 2px;
}

.btn-outlined {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1;
  min-height: 40px;
  background-color: transparent;
  color: var(--md-sys-color-primary);
  border: 1px solid var(--md-sys-color-primary);
  border-radius: var(--r);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color 0.15s, color 0.15s;
}

.btn-outlined:hover {
  background-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
}

.btn-outlined:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 2px;
}

.btn-ghost {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1;
  min-height: 40px;
  background-color: transparent;
  color: var(--md-sys-color-on-surface-variant);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--r);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color 0.15s;
}

.btn-ghost:hover {
  background-color: var(--md-sys-color-surface-container-high);
}

.btn-ghost:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 2px;
}

.btn-text-sm {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 11px;
  color: var(--md-sys-color-on-surface-variant);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: var(--r);
  letter-spacing: 0.04em;
}

.btn-text-sm:hover { color: var(--md-sys-color-on-surface); }
.btn-text-sm:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 2px;
}

/* ==========================================================================
   LOG
   ========================================================================== */
.log-wrap {
  background-color: var(--md-sys-color-surface-container-lowest);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--r);
  padding: 8px;
}

.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.log-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--md-sys-color-on-surface-variant);
}

#log {
  font-family: 'Courier New', Courier, monospace;
  font-size: 10px;
  white-space: pre-wrap;
  max-height: 120px;
  overflow-y: auto;
  color: var(--md-sys-color-on-surface-variant);
  line-height: 1.5;
}

#log .text-red-400 { color: var(--md-sys-color-error); }

/* ==========================================================================
   LAYER SELECT
   ========================================================================== */
.layer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

/* ==========================================================================
   FOOTER
   ========================================================================== */
.app-footer {
  flex-shrink: 0;
  text-align: center;
  padding: 8px 12px;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--md-sys-color-on-surface-variant);
  border-top: 1px solid var(--md-sys-color-outline-variant);
  background-color: var(--md-sys-color-surface-container-lowest);
}

/* ==========================================================================
   SCROLLBAR
   ========================================================================== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb {
  background: var(--md-sys-color-outline-variant);
  border-radius: 2px;
}

/* ==========================================================================
   UTILITÁRIOS
   ========================================================================== */
.btn-row { display: flex; gap: 8px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>

<!-- ===================== MAIN ===================== -->
<main>

  <!-- STATUS DA SELEÇÃO -->
  <div id="selStatus">
    <span>Nenhuma geometria selecionada.</span>
  </div>

  <!-- PROPRIEDADES -->
  <section class="kv-card" aria-label="Propriedades a exibir">
    <h2 class="kv-card-title">Propriedades a exibir</h2>
    <div id="propList" class="prop-grid">
      <!-- checkboxes gerados via JS -->
    </div>
  </section>

  <!-- LAYER DE DESTINO -->
  <section class="kv-card" aria-label="Layer de destino">
    <div class="layer-row">
      <h2 class="kv-card-title" style="margin-bottom:0">Layer de destino</h2>
      <button id="btnRefreshLayers" class="btn-text-sm" title="Recarregar lista de layers" aria-label="Recarregar layers">↻ recarregar</button>
    </div>
    <select id="layerSelect" class="kv-input" aria-label="Layer de destino">
      <option value="default">default</option>
    </select>
  </section>

  <!-- COTA BASE + TAMANHO DO TEXTO -->
  <section class="kv-card" aria-label="Configurações numéricas">
    <div class="input-grid">
      <div>
        <label class="kv-label" for="seaLevel">Cota base (m)</label>
        <input type="number" id="seaLevel" value="0" step="0.01" class="kv-input" aria-describedby="seaLevelHelp" />
      </div>
      <div>
        <label class="kv-label" for="textSize">Tamanho do texto</label>
        <input type="number" id="textSize" value="30" step="1" min="1" class="kv-input" />
      </div>
    </div>
    <p id="seaLevelHelp" class="kv-helper mt-8">Cota relativa ao nível do mar em relação ao zero do arquivo.</p>
  </section>

  <!-- TIPO DE SAÍDA -->
  <section class="kv-card" aria-label="Tipo de saída">
    <h2 class="kv-card-title">Tipo de saída</h2>

    <label class="kv-check-label">
      <input type="checkbox" id="outPopup" checked />
      <span>Gerar HTML Popup</span>
    </label>
    <label class="kv-check-label">
      <input type="checkbox" id="outLabel" />
      <span>Gerar Label (geometria de texto)</span>
    </label>
    <label class="kv-check-label">
      <input type="checkbox" id="outNivel" />
      <span>Gerar Rótulo de Nível <span style="font-size:11px;color:var(--md-sys-color-on-surface-variant)">(símbolo + Nível do Topo)</span></span>
    </label>

    <hr class="kv-divider" />

    <p class="kv-label" style="margin-bottom:6px">Símbolo de nível</p>
    <div class="kv-radio-row" role="radiogroup" aria-label="Modo do símbolo de nível">
      <label class="kv-radio-label"><input type="radio" name="symMode" value="auto" checked /> Auto</label>
      <label class="kv-radio-label"><input type="radio" name="symMode" value="2d" /> 2D</label>
      <label class="kv-radio-label"><input type="radio" name="symMode" value="3d" /> 3D</label>
    </div>

    <hr class="kv-divider" />

    <label class="kv-check-label">
      <input type="checkbox" id="autoSync" />
      <span>Sincronização automática <span style="font-size:11px;color:var(--md-sys-color-on-surface-variant)">(atualiza labels quando a origem mudar)</span></span>
    </label>
  </section>

  <!-- MODO DE ATUALIZAÇÃO -->
  <section class="kv-card" aria-label="Modo de atualização">
    <h2 class="kv-card-title">Ao atualizar, exibir</h2>
    <div role="radiogroup" aria-label="Modo de atualização">
      <label class="kv-radio-label" style="min-height:32px;margin-bottom:4px">
        <input type="radio" name="updMode" value="original" checked />
        <span>As propriedades da criação de cada ponto</span>
      </label>
      <label class="kv-radio-label" style="min-height:32px">
        <input type="radio" name="updMode" value="app" />
        <span>As propriedades marcadas no app agora</span>
      </label>
    </div>
  </section>

  <!-- AÇÕES -->
  <div>
    <button id="btnApply" class="btn-primary" aria-label="Aplicar anotações nas features selecionadas">
      Aplicar Anotações
    </button>
  </div>
  <div class="btn-row">
    <button id="btnUpdateAll" class="btn-outlined" title="Atualiza todos os pontos do app no projeto" aria-label="Atualizar todos os pontos">
      Atualizar Todos
    </button>
    <button id="btnUpdateSel" class="btn-outlined" title="Atualiza apenas os pontos vinculados aos elementos selecionados" aria-label="Atualizar selecionados">
      Atualizar Selecionados
    </button>
  </div>
  <div class="btn-row">
    <button id="btnClear" class="btn-ghost" title="Remove labels criados por este app e fecha o popup" aria-label="Limpar anotações">
      Limpar
    </button>
    <button id="btnInspect" class="btn-ghost" title="Despeja o JSON raw das properties da seleção no log" aria-label="Inspecionar propriedades">
      Inspecionar
    </button>
    <button id="btnDiagView" class="btn-ghost" title="Despeja no log tudo que o SDK expõe sobre a câmera — use para calibrar a detecção Auto 2D/3D" aria-label="Diagnóstico da detecção de vista">
      Diag. Vista
    </button>
  </div>

  <!-- LOG -->
  <div class="log-wrap">
    <div class="log-header">
      <span class="log-label">Log</span>
      <button id="btnClearLog" class="btn-text-sm" aria-label="Limpar log">limpar</button>
    </div>
    <div id="log" role="log" aria-live="polite" aria-label="Log de operações"></div>
  </div>

</main>

<!-- ===================== FOOTER ===================== -->
<footer class="app-footer">
  KV Arquitetos · Gerador de Anotações · Beta V28
</footer>

<script type="module">
import { rpc, giraffeState } from 'https://esm.sh/@gi-nx/iframe-sdk';

/* =========================================================
   CONSTANTES
   ========================================================= */
const SP_TAG = 'kv_annot';            // tag para deleção idempotente (padrão Sun Path)
const UI_STORE = 'kv_annot_ui';       // persistência do estado da interface
const DEFAULT_PROPS = [
  { key: 'levels',       label: 'Levels (pavimentos)',    pt: 'Pavimentos',    def: true  },
  { key: 'usage',        label: 'Usage (uso)',            pt: 'Uso',           def: false },
  { key: 'area',         label: 'Area (m²)',              pt: 'Área',          def: false },
  { key: 'height',       label: 'Height (m)',             pt: 'Altura',        def: false },
  { key: 'name',         label: 'Name (nome)',            pt: 'Nome',          def: false },
  { key: 'floorToFloor', label: 'Floor to Floor',         pt: 'Piso a Piso',   def: true  },
  { key: 'baseHeight',   label: 'Base Height (altura na base)', pt: 'Altura na Base', def: false },
  { key: 'nivelDaBase',  label: 'Nível da Base (base + cota)',  pt: 'Nível da Base',  def: false },
  { key: 'nivelDoTopo',  label: 'Nível do Topo (altura + cota)', pt: 'Nível do Topo', def: false },
];
const PROP_PT = Object.fromEntries(DEFAULT_PROPS.map((p) => [p.key, p.pt]));
PROP_PT.nivelDoMar = 'Nível do Topo';  // alias — pontos criados na v10 usavam esta chave

/* =========================================================
   PERSISTÊNCIA DO ESTADO DA UI (sobrevive a reload/fechar app)
   ========================================================= */
function saveUiState() {
  const state = {
    props: getSelectedPropKeys(),
    outPopup: $('outPopup').checked,
    outLabel: $('outLabel').checked,
    outNivel: $('outNivel').checked,
    layer: $('layerSelect').value,
    seaLevel: $('seaLevel').value,
    textSize: $('textSize').value,
    updateMode: document.querySelector('input[name="updMode"]:checked')?.value || 'original',
    symMode: symbolModeSetting(),
  };
  localStorage.setItem(UI_STORE, JSON.stringify(state));
}

function restoreUiState() {
  let state = null;
  try { state = JSON.parse(localStorage.getItem(UI_STORE)); } catch (e) {}
  if (!state) return;

  if (Array.isArray(state.props)) {
    propListEl.querySelectorAll('input').forEach((el) => {
      el.checked = state.props.includes(el.dataset.prop);
    });
  }
  if (typeof state.outPopup === 'boolean') $('outPopup').checked = state.outPopup;
  if (typeof state.outLabel === 'boolean') $('outLabel').checked = state.outLabel;
  if (typeof state.outNivel === 'boolean') $('outNivel').checked = state.outNivel;
  if (state.seaLevel !== undefined) $('seaLevel').value = state.seaLevel;
  if (state.textSize !== undefined) $('textSize').value = state.textSize;
  if (state.updateMode) {
    const radio = document.querySelector(`input[name="updMode"][value="${state.updateMode}"]`);
    if (radio) radio.checked = true;
  }
  if (state.symMode) {
    const radio = document.querySelector(`input[name="symMode"][value="${state.symMode}"]`);
    if (radio) radio.checked = true;
  }
  // Layer é restaurado após populateLayerSelect (a opção precisa existir)
  window.__kvPendingLayer = state.layer || null;
  log('Estado da interface restaurado.');
}

/* =========================================================
   LAYERS DO PROJETO — popula o dropdown de destino
   ========================================================= */
function extractLayerEntries(raw) {
  let items = [];
  if (Array.isArray(raw)) items = raw;
  else if (raw && typeof raw === 'object') items = Object.values(raw);
  return items
    .filter((l) => l && (l.id || l.name || typeof l === 'string'))
    .map((l) => {
      if (typeof l === 'string') return { id: l, name: l };
      return { id: l.id || l.name, name: l.name || l.id };
    });
}

function populateLayerSelect() {
  const sel = $('layerSelect');
  const current = sel.value;
  const found = new Map();

  // Fonte 1 (confiável): layerIds em uso nos rawSections do projeto
  try {
    getRawSectionFeatures().forEach((f) => {
      const lid = f?.properties?.layerId;
      if (lid && !found.has(lid)) found.set(lid, { id: lid, name: lid });
    });
  } catch (e) { /* ignorar */ }

  // Fonte 2: chaves candidatas do giraffeState — variam entre versões do SDK
  ['projectLayers', 'layers', 'drawingLayers', 'lensableLayers'].forEach((key) => {
    try {
      const entries = extractLayerEntries(giraffeState.get(key));
      entries.forEach((e) => { if (!found.has(e.id)) found.set(e.id, e); });
    } catch (e) { /* chave inexistente — ignorar */ }
  });

  sel.innerHTML = '<option value="default">default</option>';
  [...found.values()]
    .filter((e) => e.id !== 'default')
    .sort((a, b) => String(a.name).localeCompare(String(b.name)))
    .forEach((e) => {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = e.name;
      sel.appendChild(opt);
    });

  // Restaura seleção anterior se ainda existir
  if ([...sel.options].some((o) => o.value === current)) sel.value = current;
  log(`Dropdown de layers: ${found.size} layer(s) do projeto + default.`);
}

$('btnRefreshLayers').onclick = populateLayerSelect;

/* =========================================================
   HELPERS DE GEOMETRIA
   ========================================================= */

// Achata coordenadas de qualquer geometria em uma lista de [lng, lat]
function flattenCoords(geom, out = []) {
  if (!geom) return out;
  if (geom.type === 'GeometryCollection') {
    (geom.geometries || []).forEach((g) => flattenCoords(g, out));
    return out;
  }
  const walk = (c) => {
    if (typeof c[0] === 'number') out.push(c);
    else c.forEach(walk);
  };
  if (geom.coordinates) walk(geom.coordinates);
  return out;
}

// Centroide simples: média das coordenadas
function centroid(feature) {
  const pts = flattenCoords(feature.geometry);
  if (!pts.length) return null;
  let sx = 0, sy = 0;
  pts.forEach(([x, y]) => { sx += x; sy += y; });
  return [sx / pts.length, sy / pts.length];
}

// Extrai valor de propriedade (raw ou dentro de properties)
function getProp(feature, key) {
  const p = feature.properties || {};
  let v = p[key];
  if (v === undefined && feature[key] !== undefined) v = feature[key];
  if (v === undefined || v === null || v === '') return null;
  if (typeof v === 'number') return Math.round(v * 100) / 100;
  return v;
}

/* =========================================================
   RESOLVEDOR DE PROPRIEDADES — com fallbacks para calculadas
   getSelectedFeatures retorna features RAW; area/height/name são
   propriedades EVALUATED (calculadas pelo engine) e podem faltar.
   ========================================================= */
async function resolveProps(feature, keys) {
  const p = feature.properties || {};
  const out = {};

  // Altura na base: _baseHeight (avaliada, inclui stack) → baseHeight (raw)
  const resolveBaseHeight = () => {
    if (typeof p._baseHeight === 'number') return Math.round(p._baseHeight * 100) / 100;
    return getProp(feature, 'baseHeight');
  };

  // Topo (cota absoluta): _height avaliada JÁ inclui base/stack — usar direto.
  // Fallback raw: base + corpo (height ou levels × floorToFloor)
  const resolveTopHeight = () => {
    if (typeof p._height === 'number' && p._height > 0) {
      return Math.round(p._height * 100) / 100;   // avaliada = topo absoluto
    }
    let t = getProp(feature, 'topHeight');
    if (t !== null) return t;
    if (typeof p._topHeight === 'number') return Math.round(p._topHeight * 100) / 100;
    let h = getProp(feature, 'height');
    if (h === null) {
      const lv = Number(p.levels), ff = Number(p.floorToFloor);
      if (isFinite(lv) && isFinite(ff) && lv > 0 && ff > 0) h = lv * ff;
    }
    if (h === null) return null;
    const b = resolveBaseHeight() || 0;
    return Math.round((h + b) * 100) / 100;
  };

  const cotaBase = () => parseFloat($('seaLevel').value) || 0;

  for (const k of keys) {
    if (k === 'height') {
      out[k] = resolveTopHeight();                        // Altura = top height
    } else if (k === 'baseHeight') {
      out[k] = resolveBaseHeight();
    } else if (k === 'nivelDaBase') {
      const b = resolveBaseHeight();
      out[k] = b === null ? null : Number((b + cotaBase()).toFixed(2));
    } else if (k === 'nivelDoTopo' || k === 'nivelDoMar') {   // alias v10
      const t = resolveTopHeight();
      out[k] = t === null ? null : Number((t + cotaBase()).toFixed(2));
    } else if (k === 'area') {
      let a = getProp(feature, 'area');
      if (a === null) {
        try {
          const r = await rpc.invoke('featureArea', [feature]);
          if (typeof r === 'number' && isFinite(r)) a = Math.round(r * 100) / 100;
        } catch (e) { /* featureArea indisponível — segue null */ }
      }
      out[k] = a;
    } else if (k === 'name') {
      out[k] = getProp(feature, 'name') || getProp(feature, 'usage');
    } else {
      out[k] = getProp(feature, k);
    }
  }
  return out;
}

/* =========================================================
   LEITURA DA SELEÇÃO
   ========================================================= */
async function readSelection() {
  try {
    const result = await rpc.invoke('getSelectedFeatures', []);
    // Normalização defensiva: pode vir array, FeatureCollection ou objeto
    let feats = [];
    if (Array.isArray(result)) feats = result;
    else if (result?.features) feats = result.features;
    else if (result && typeof result === 'object') feats = Object.values(result);
    return feats.filter((f) => f && f.geometry);
  } catch (e) {
    log('Erro em getSelectedFeatures: ' + e.message, true);
    return [];
  }
}

function updateSelStatus(feats) {
  const el = $('selStatus');
  if (!feats.length) {
    el.innerHTML = '<span class="text-gray-400">Nenhuma geometria selecionada.</span>';
    return;
  }
  const types = {};
  feats.forEach((f) => { const t = f.geometry?.type || '?'; types[t] = (types[t] || 0) + 1; });
  const summary = Object.entries(types).map(([t, n]) => `${n}× ${t}`).join(', ');
  el.innerHTML = `<span class="kv-accent font-semibold">${feats.length} feature(s):</span> <span class="text-gray-300">${summary}</span>`;
}

/* =========================================================
   LISTENER DE SELEÇÃO (giraffeState)
   ========================================================= */
function setupSelectionListener() {
  // A chave exata pode variar entre versões do SDK; tentamos as candidatas
  const candidateKeys = ['selected', 'selectedFeatures', 'mapSelectCoord'];
  candidateKeys.forEach((key) => {
    try {
      giraffeState.addListener([key], async () => {
        const feats = await readSelection();
        updateSelStatus(feats);
        // Reexibe popup registrado se o elemento de origem for reselecionado
        if (feats.length === 1) {
          const srcId = feats[0].properties?.id || feats[0].id;
          const saved = srcId ? popupRegistry.get(srcId) : null;
          if (saved) {
            try {
              await rpc.invoke('addHtmlPopup', [saved.html, saved.location, { closeButton: true, maxWidth: '320px' }]);
            } catch (e) { /* silencioso */ }
          }
        }
      });
    } catch (e) {
      // chave inexistente nesta versão — ignorar silenciosamente
    }
  });
  log('Listener de seleção registrado.');
}

/* =========================================================
   POPUP HTML
   O popup do SDK é efêmero: some ao desselecionar. Mantemos um
   registro em memória e reexibimos quando o elemento de origem
   for selecionado de novo (enquanto o app estiver aberto).
   ========================================================= */
const popupRegistry = new Map();   // sourceId -> { location, html }

function buildPopupHtml(title, values) {
  const rows = Object.entries(values)
    .map(([k, v]) => {
      if (v === null) return '';
      return `<tr>
        <td style="padding:2px 8px 2px 0;color:#00ACCD;font-weight:600;">${PROP_PT[k] || k}</td>
        <td style="padding:2px 0;color:#333;">${v}</td>
      </tr>`;
    })
    .filter(Boolean)
    .join('');

  if (!rows) return null;

  return `<div style="font-family:Hind,sans-serif;font-size:12px;min-width:140px;">
    <div style="font-weight:700;border-bottom:2px solid #00ACCD;margin-bottom:4px;padding-bottom:2px;">
      ${title || 'Feature'}
    </div>
    <table style="border-collapse:collapse;">${rows}</table>
  </div>`;
}

async function applyPopups(features, propKeys) {
  // O SDK mantém apenas um popup SDK ativo por vez; aplicamos no
  // centroide de cada feature em sequência — o último fica visível.
  let count = 0;
  for (const f of features) {
    const c = centroid(f);
    if (!c) continue;
    const values = await resolveProps(f, propKeys);
    const title = getProp(f, 'name') || getProp(f, 'usage') || 'Feature';
    const html = buildPopupHtml(title, values);
    if (!html) continue;
    try {
      // Assinatura posicional confirmada nos docs: (html, lngLat, PopupOptions)
      await rpc.invoke('addHtmlPopup', [html, c, { closeButton: true, maxWidth: '320px' }]);
      const srcId = f.properties?.id || f.id;
      if (srcId) popupRegistry.set(srcId, { location: c, html });
      log(`Popup criado em [${c[0].toFixed(6)}, ${c[1].toFixed(6)}]`);
      try { await rpc.invoke('flyTo', [{ center: c, duration: 800 }]); } catch (e) {}
      count++;
    } catch (e) {
      log('addHtmlPopup falhou: ' + e.message, true);
    }
  }
  log(`Popup(s) aplicado(s): ${count}${count > 1 ? ' (apenas o último permanece visível — limitação do SDK)' : ''}`);
}

/* =========================================================
   LABELS — Points com propriedades nativas de texto
   ========================================================= */
function templateFromValues(values) {
  const copiedProps = {};
  const templateLines = [];
  Object.entries(values).forEach(([k, v]) => {
    if (v === null) return;
    copiedProps['kv_' + k] = v;
    templateLines.push(`${PROP_PT[k] || k}: {{get(properties, 'kv_${k}')}}`);
  });
  return { copiedProps, text: templateLines.join('\n') };
}

async function buildLabelFeatures(features, propKeys) {
  const out = [];
  const stamp = Date.now();
  for (let i = 0; i < features.length; i++) {
    const f = features[i];
    const c = centroid(f);
    if (!c) continue;

    // Valores resolvidos (com fallbacks) copiados com prefixo kv_ —
    // evita colisão com chaves nativas (usage, height, levels).
    const values = await resolveProps(f, propKeys);
    const { copiedProps, text } = templateFromValues(values);
    if (!text) continue;

    // Eleva o ponto ao topo do elemento: baseHeight do ponto = topHeight
    // da origem (coordenada do arquivo, sem a cota base, que é só exibição)
    const topElev = (await resolveProps(f, ['height'])).height || 0;

    out.push({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: c },
      properties: {
        // --- valores copiados da feature de origem (lidos pelos templates) ---
        ...copiedProps,
        // --- estrutura nativa do ponto de texto (genericPoint/Pin) ---
        // (depois do spread: nada pode sobrescrever usage/type/layerId)
        type: 'genericPoint',
        usage: 'Pin',
        radius: 0.1,               // raio mínimo — geometria do ponto invisível
        // Layer escolhido no dropdown do app (padrão: 'default')
        // (obrigatório ter layerId — sem ele: cleanedSections undefined)
        layerId: $('layerSelect').value || 'default',
        public: true,
        stackOrder: 0,
        _visible: true,
        baseHeight: topElev,     // rawSections permanentes usam sem underscore
        _baseHeight: topElev,    // versão com underscore (palette/temp) por segurança
        _height: 0,
        _baseElevation: 0,
        marker: {
          kind: 'text',
          value: {
            text,
            onTop: true,
            scale: 1,
            shape: 'square',
            stick: false,
            anchor: 'bottom',
            textSize: parseFloat($('textSize').value) || 30,
            shapeSize: 40,
            textColor: '#041178',
            renderMode: 'screen',
            borderColor: '#00ACCD',
            borderWidth: 3,
            stickHeight: 0,
            backgroundColor: '#FFFFFF',
          },
        },
        // --- controle do app ---
        sp_tag: SP_TAG,
        sp_source: f.properties?.id || f.id || null,  // vínculo com a feature de origem
        sp_srcAnchor: c,                               // centróide da origem nesta sincronização
        sp_props: propKeys,                            // quais propriedades sincronizar
        name: `kv_annot_${stamp}_${i + 1}`,            // único — não conflita com anteriores
      },
    });
  }
  return out;
}

// Deleção idempotente: varre rawSections e remove features com sp_tag
async function deleteTaggedSections() {
  try {
    let raw = giraffeState.get('rawSections');
    // rawSections pode vir como objeto {features:[...]} ou array — normalizar
    let feats = [];
    if (Array.isArray(raw)) feats = raw;
    else if (raw?.features) feats = raw.features;
    else if (raw && typeof raw === 'object') feats = Object.values(raw);

    const ids = feats
      .filter((f) => f?.properties?.sp_tag === SP_TAG)
      .map((f) => f.id || f.properties?.id)
      .filter(Boolean);

    if (ids.length) {
      await rpc.invoke('deleteRawSections', [ids]);
      log(`Removidos ${ids.length} label(s) anteriores (tag ${SP_TAG}).`);
    }
    return ids.length;
  } catch (e) {
    log('deleteTaggedSections: ' + e.message, true);
    return 0;
  }
}

async function applyLabels(features, propKeys) {
  const labelFeats = await buildLabelFeatures(features, propKeys);
  if (!labelFeats.length) {
    log('Nenhum label a criar (sem propriedades válidas).');
    return;
  }
  // NÃO deleta os antigos — múltiplas anotações do mesmo elemento
  // podem coexistir (ex.: labels com conjuntos de propriedades diferentes).
  // A limpeza total continua disponível no botão "Limpar".
  try {
    isSelfWriting = true;
    await rpc.invoke('createRawSections', [labelFeats]);
    log(`${labelFeats.length} label(s) criado(s) via createRawSections.`);
  } catch (e) {
    log('createRawSections falhou: ' + e.message, true);
  } finally {
    releaseSelfWriting();
  }
}

/* =========================================================
   RÓTULO DE NÍVEL — símbolo arquitetônico (triângulo + haste)
   Texto e símbolo num ÚNICO SVG: giram e escalam juntos.
   ========================================================= */
function fmtBR(v) {
  return v.toFixed(2).replace('.', ',');
}

// Símbolo 3D (elevação): barra + haste + triângulo meio-preenchido
function nivelSvg3d(valueText) {
  const fontSize = 26;
  const charW = fontSize * 0.58;
  const textW = Math.ceil(valueText.length * charW);
  const W = 46 + textW + 10;
  const H = 64;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
    `<text x="26" y="${fontSize - 4}" font-family="Arial, Helvetica, sans-serif" font-size="${fontSize}" fill="#000">${valueText}</text>` +
    `<line x1="20" y1="${fontSize + 2}" x2="${W - 4}" y2="${fontSize + 2}" stroke="#000" stroke-width="2"/>` +
    `<line x1="20" y1="${fontSize + 2}" x2="20" y2="${H - 4}" stroke="#000" stroke-width="2"/>` +
    `<polygon points="4,${H - 22} 36,${H - 22} 20,${H - 4}" fill="none" stroke="#000" stroke-width="2"/>` +
    `<polygon points="20,${H - 22} 36,${H - 22} 20,${H - 4}" fill="#000"/>` +
    `</svg>`;
  return { svg, W, H };
}

// Símbolo 2D (planta): círculo de quadrantes NE/SO com eixos atravessando,
// texto apoiado sobre a linha horizontal (referência do usuário)
function nivelSvg2d(valueText) {
  const fontSize = 26;
  const charW = fontSize * 0.58;
  const textW = Math.ceil(valueText.length * charW);
  const r = 15;
  const cx = r + 11;            // espaço p/ extensão esquerda do eixo
  const cy = fontSize + 10;     // texto cabe acima da linha
  const ext = 8;                // quanto os eixos ultrapassam o círculo
  const W = cx + r + 10 + textW + 10;
  const H = cy + r + ext + 3;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
    // eixo vertical (atravessa o círculo, ultrapassa acima e abaixo)
    `<line x1="${cx}" y1="${cy - r - ext}" x2="${cx}" y2="${cy + r + ext}" stroke="#000" stroke-width="1.5"/>` +
    // eixo horizontal (ultrapassa à esquerda e corre sob o texto à direita)
    `<line x1="${cx - r - ext}" y1="${cy}" x2="${W - 2}" y2="${cy}" stroke="#000" stroke-width="1.5"/>` +
    // círculo com quadrantes NE e SO preenchidos
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#000" stroke-width="2"/>` +
    `<path d="M${cx},${cy} L${cx},${cy - r} A${r},${r} 0 0 1 ${cx + r},${cy} Z" fill="#000"/>` +
    `<path d="M${cx},${cy} L${cx},${cy + r} A${r},${r} 0 0 1 ${cx - r},${cy} Z" fill="#000"/>` +
    // texto apoiado sobre a linha horizontal
    `<text x="${cx + r + 10}" y="${cy - 5}" font-family="Arial, Helvetica, sans-serif" font-size="${fontSize}" fill="#000">${valueText}</text>` +
    `</svg>`;
  return { svg, W, H };
}

// Rasteriza o SVG em PNG Base64 via canvas — o loader de ícones do Giraffe
// aceita PNG Base64 em spriteUrl (comprovado na v17).
const nivelPngCache = new Map();
function nivelPngDataUri(valueText, mode) {
  const cacheKey = mode + '|' + valueText;
  if (nivelPngCache.has(cacheKey)) {
    return Promise.resolve(nivelPngCache.get(cacheKey));
  }
  return new Promise((resolve, reject) => {
    const { svg, W, H } = mode === '2d' ? nivelSvg2d(valueText) : nivelSvg3d(valueText);
    const uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    const img = new Image();
    const RES = 3; // multiplicador de resolução para nitidez em zoom
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = W * RES;
      canvas.height = H * RES;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const png = canvas.toDataURL('image/png');
      nivelPngCache.set(cacheKey, png);
      resolve(png);
    };
    img.onerror = () => reject(new Error('Falha ao rasterizar SVG do rótulo de nível'));
    img.src = uri;
  });
}

/* =========================================================
   MODO DE VISTA (2D/3D) — detecção automática + seletor manual
   ========================================================= */
let currentViewMode = '3d';   // modo efetivo aplicado aos símbolos

function symbolModeSetting() {
  return document.querySelector('input[name="symMode"]:checked')?.value || 'auto';
}

function effectiveMode() {
  const s = symbolModeSetting();
  return s === 'auto' ? currentViewMode : s;
}

// Troca o sprite de todos os rótulos de nível para o modo dado
async function applyViewModeToNivel(mode) {
  const all = getRawSectionFeatures();
  const points = all.filter(
    (f) => f?.properties?.sp_tag === SP_TAG && f?.properties?.sp_kind === 'nivel'
  );
  if (!points.length) return;

  const toUpdate = [];
  for (const pt of points) {
    if (pt.properties.sp_view === mode) continue;   // já está no modo certo
    const nv = pt.properties.kv_nivelDoTopo;
    if (nv === null || nv === undefined) continue;
    let png;
    try { png = await nivelPngDataUri(fmtBR(nv), mode); } catch (e) { continue; }
    toUpdate.push({
      ...pt,
      geometry: pt.geometry,
      properties: {
        ...pt.properties,
        sp_view: mode,
        marker: {
          ...pt.properties.marker,
          value: {
            ...(pt.properties.marker?.value || {}),
            spriteUrl: png,
            // 2D: ponto no centro do círculo; 3D: ponto no vértice do triângulo
            anchor: mode === '2d' ? 'center' : 'bottom',
          },
        },
      },
    });
  }
  if (!toUpdate.length) return;
  try {
    isSelfWriting = true;
    await rpc.invoke('updateRawSections', [toUpdate]);
    log(`Símbolos de nível trocados para modo ${mode.toUpperCase()} (${toUpdate.length} rótulo(s)).`);
  } catch (e) {
    log('Troca de modo dos símbolos falhou: ' + e.message, true);
  } finally {
    releaseSelfWriting();
  }
}

// ═══════════════════════════════════════════════════════════════════
// DETECÇÃO AUTOMÁTICA DE VISTA (2D planta / 3D perspectiva)
//
// O pitch da câmera NÃO está exposto em nenhuma chave conhecida do
// giraffeState nesta versão do SDK (confirmado em teste). Por isso a
// detecção usa três métodos, do mais direto ao mais robusto:
//
//   M1. Varredura PROFUNDA do giraffeState — descobre a chave que
//       contém 'pitch' dinamicamente, sem lista fixa de candidatas.
//   M2. Geometria da viewport via getMapBounds — em perspectiva o
//       polígono visível é um TRAPÉZIO (a borda distante é mais larga);
//       em planta é um RETÂNGULO. A razão entre lados opostos revela
//       a inclinação sem depender de nenhuma chave interna.
//   M3. Eventos do mapbox (pitchend/moveend) para reagir na hora,
//       quando o SDK os repassar.
//
// Limiar: razão > 1.12 entre lados opostos = 3D; <= 1.03 = 2D.
// ═══════════════════════════════════════════════════════════════════

// ─── M1: varredura profunda por 'pitch' no estado ───
const HEAVY_KEYS = new Set(['rawSections', 'bakedSections', 'sections', 'mapContent', 'stackedSections', 'projectSections']);

function deepFindPitch(v, depth = 0, seen = new Set()) {
  if (v == null || depth > 4 || typeof v !== 'object') return undefined;
  if (seen.has(v)) return undefined;
  seen.add(v);
  if (typeof v.pitch === 'number' && isFinite(v.pitch)) return v.pitch;
  if (Array.isArray(v)) {
    if (v.length > 50) return undefined;      // array grande = dados, não câmera
    for (const item of v) {
      const r = deepFindPitch(item, depth + 1, seen);
      if (typeof r === 'number') return r;
    }
    return undefined;
  }
  for (const [k, val] of Object.entries(v)) {
    if (HEAVY_KEYS.has(k)) continue;
    const r = deepFindPitch(val, depth + 1, seen);
    if (typeof r === 'number') return r;
  }
  return undefined;
}

// Lista as chaves reais do giraffeState (a API varia entre versões)
function giraffeStateKeys() {
  const out = new Set();
  try {
    if (typeof giraffeState.getKeys === 'function') {
      (giraffeState.getKeys() || []).forEach((k) => out.add(k));
    }
  } catch (e) { /* ignorar */ }
  ['state', 'store', '_state', '_store', 'data', 'cache', 'values'].forEach((prop) => {
    try {
      const s = giraffeState[prop];
      if (!s) return;
      if (s instanceof Map) [...s.keys()].forEach((k) => out.add(k));
      else if (typeof s === 'object') Object.keys(s).forEach((k) => out.add(k));
    } catch (e) { /* ignorar */ }
  });
  // Candidatas conhecidas como reforço
  ['camera', 'view', 'viewState', 'mapView', 'cameraPosition', 'viewport',
   'activeView', 'mapCamera', 'mapState', 'projectView'].forEach((k) => out.add(k));
  return [...out].filter((k) => !HEAVY_KEYS.has(k));
}

let pitchKey = null;
function pitchFromState() {
  const keys = pitchKey ? [pitchKey] : giraffeStateKeys();
  for (const key of keys) {
    try {
      const p = deepFindPitch(giraffeState.get(key));
      if (typeof p === 'number') {
        if (!pitchKey) { pitchKey = key; log(`Detecção de vista: pitch encontrado em giraffeState '${key}'.`); }
        return p;
      }
    } catch (e) { /* chave inexistente */ }
  }
  return null;
}

// Alguns builds do Giraffe expõem apenas um booleano de modo 3D em vez
// do pitch numérico. Procuramos essa flag como segunda via.
function deepFind3dFlag(v, depth = 0, seen = new Set()) {
  if (v == null || depth > 4 || typeof v !== 'object') return undefined;
  if (seen.has(v)) return undefined;
  seen.add(v);
  if (Array.isArray(v)) {
    if (v.length > 50) return undefined;
    for (const item of v) {
      const r = deepFind3dFlag(item, depth + 1, seen);
      if (typeof r === 'boolean') return r;
    }
    return undefined;
  }
  for (const [k, val] of Object.entries(v)) {
    if (HEAVY_KEYS.has(k)) continue;
    const lk = k.toLowerCase();
    if (typeof val === 'boolean' && (lk === 'is3d' || lk === 'threed' || lk === 'in3d' || lk === 'mode3d' || lk === 'perspective')) {
      return val;
    }
    if (typeof val === 'string' && (lk === 'viewmode' || lk === 'mapmode' || lk === 'mode')) {
      const lv = val.toLowerCase();
      if (lv === '3d' || lv === 'perspective') return true;
      if (lv === '2d' || lv === 'plan' || lv === 'top') return false;
    }
    const r = deepFind3dFlag(val, depth + 1, seen);
    if (typeof r === 'boolean') return r;
  }
  return undefined;
}

let flagKey = null;
function modeFromFlag() {
  const keys = flagKey ? [flagKey] : giraffeStateKeys();
  for (const key of keys) {
    try {
      const f = deepFind3dFlag(giraffeState.get(key));
      if (typeof f === 'boolean') {
        if (!flagKey) { flagKey = key; log(`Detecção de vista: flag 3D encontrada em giraffeState '${key}'.`); }
        return f ? '3d' : '2d';
      }
    } catch (e) { /* chave inexistente */ }
  }
  return null;
}

// ─── M2: geometria da viewport (trapézio = perspectiva) ───
// Só passa a comandar o modo depois de PROVAR que o polígono retornado
// é a viewport real (já observou um trapézio). Enquanto não provar, não
// força 2D — evita falso negativo caso a API devolva apenas um bbox.
let boundsProven = false;

function ringFromBounds(res) {
  if (!res) return null;
  let geom = null;
  if (res.type === 'FeatureCollection') geom = res.features?.[0]?.geometry;
  else if (res.type === 'Feature') geom = res.geometry;
  else if (res.type) geom = res;
  const coords = geom?.coordinates?.[0];
  if (!Array.isArray(coords) || coords.length < 4) return null;
  return coords.slice(0, 4);
}

function trapezoidRatio(ring) {
  const lat0 = ring.reduce((s, p) => s + p[1], 0) / ring.length;
  const kx = 111320 * Math.cos((lat0 * Math.PI) / 180);
  const ky = 110540;
  const P = ring.map(([lng, lat]) => [lng * kx, lat * ky]);
  const d = (a, b) => Math.hypot(P[a][0] - P[b][0], P[a][1] - P[b][1]);
  const s = [d(0, 1), d(1, 2), d(2, 3), d(3, 0)];
  if (s.some((x) => x < 1e-6)) return null;
  const r1 = Math.max(s[0], s[2]) / Math.min(s[0], s[2]);
  const r2 = Math.max(s[1], s[3]) / Math.min(s[1], s[3]);
  return Math.max(r1, r2);
}

async function modeFromBounds() {
  let res;
  try { res = await rpc.invoke('getMapBounds', []); } catch (e) { return null; }
  const ring = ringFromBounds(res);
  if (!ring) return null;
  const ratio = trapezoidRatio(ring);
  if (ratio === null) return null;
  if (ratio > 1.12) {
    if (!boundsProven) { boundsProven = true; log('Detecção de vista ativa por geometria da viewport.'); }
    return '3d';
  }
  if (ratio <= 1.03 && boundsProven) return '2d';
  return null;   // zona cinzenta ou método ainda não provado
}

// ─── Orquestração ───
function setViewMode(mode, why) {
  if (!mode || mode === currentViewMode) return;
  currentViewMode = mode;
  log(`Vista: ${mode.toUpperCase()} (${why}).`);
  if (symbolModeSetting() === 'auto') applyViewModeToNivel(mode);
}

let evaluating = false;
async function evaluateViewMode() {
  if (evaluating) return;
  evaluating = true;
  try {
    const p = pitchFromState();
    if (typeof p === 'number') {
      setViewMode(p < 5 ? '2d' : '3d', `pitch ${p.toFixed(1)}°`);
      return;
    }
    const flagMode = modeFromFlag();
    if (flagMode) {
      setViewMode(flagMode, 'flag de modo do Giraffe');
      return;
    }
    const m = await modeFromBounds();
    if (m) setViewMode(m, 'geometria da viewport');
  } finally {
    evaluating = false;
  }
}

function setupViewModeDetection() {
  // M3: eventos do mapbox — reação imediata quando disponíveis
  ['pitchend', 'moveend', 'zoomend'].forEach((ev) => {
    try { rpc.invoke('addMapboxEventListener', [ev]); } catch (e) { /* ignorar */ }
  });
  ['mapboxEvent', 'mapEvent', 'mapContentEvent'].forEach((k) => {
    try { giraffeState.addListener([k], () => evaluateViewMode()); } catch (e) { /* ignorar */ }
  });

  // Listener nas chaves de estado que possam carregar a câmera
  giraffeStateKeys().forEach((key) => {
    try { giraffeState.addListener([key], () => evaluateViewMode()); } catch (e) { /* ignorar */ }
  });

  // Polling — só custa RPC quando o modo Auto está ligado e existem
  // rótulos de nível no projeto para atualizar.
  setInterval(() => {
    if (symbolModeSetting() !== 'auto') return;
    const hasNivel = getRawSectionFeatures().some(
      (f) => f?.properties?.sp_tag === SP_TAG && f?.properties?.sp_kind === 'nivel'
    );
    if (!hasNivel) return;
    evaluateViewMode();
  }, 1000);

  evaluateViewMode();
}

async function applyNivelLabels(features) {
  const out = [];
  const stamp = Date.now();
  for (let i = 0; i < features.length; i++) {
    const f = features[i];
    const c = centroid(f);
    if (!c) continue;

    const values = await resolveProps(f, ['nivelDoTopo']);
    const nv = values.nivelDoTopo;
    if (nv === null || nv === undefined) continue;
    const topElev = (await resolveProps(f, ['height'])).height || 0;

    let pngUrl;
    const mode = effectiveMode();
    try {
      pngUrl = await nivelPngDataUri(fmtBR(nv), mode);
    } catch (e) {
      log('Rasterização do símbolo falhou: ' + e.message, true);
      continue;
    }

    out.push({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: c },
      properties: {
        kv_nivelDoTopo: nv,
        type: 'genericPoint',
        usage: 'Pin',
        radius: 0.1,               // raio mínimo — geometria do ponto invisível
        layerId: $('layerSelect').value || 'default',
        public: true,
        stackOrder: 0,
        _visible: true,
        baseHeight: topElev,
        _baseHeight: topElev,
        _height: 0,
        _baseElevation: 0,
        marker: {
          kind: 'icon',
          value: {
            spriteUrl: pngUrl,                 // chave nativa (dump do Pin icon)
            spriteSize: 64,                    // tamanho base = altura lógica do desenho
            // fator 2.5 calibrado em teste — tamanho 30 ≙ scale 2.5
            scale: ((parseFloat($('textSize').value) || 30) / 30) * 2.5,
            onTop: true,
            stick: false,
            stickHeight: 0,
            anchor: mode === '2d' ? 'center' : 'bottom',
            renderMode: 'screen',
          },
        },
        sp_tag: SP_TAG,
        sp_kind: 'nivel',
        sp_view: mode,
        sp_source: f.properties?.id || f.id || null,
        sp_srcAnchor: c,
        sp_props: ['nivelDoTopo'],
        name: `kv_nivel_${stamp}_${i + 1}`,
      },
    });
  }

  if (!out.length) {
    log('Nenhum rótulo de nível a criar (Nível do Topo não resolvido).');
    return;
  }
  try {
    isSelfWriting = true;
    await rpc.invoke('createRawSections', [out]);
    log(`${out.length} rótulo(s) de nível criado(s).`);
  } catch (e) {
    log('createRawSections (nível) falhou: ' + e.message, true);
  } finally {
    releaseSelfWriting();
  }
}

/* =========================================================
   AÇÕES PRINCIPAIS
   ========================================================= */
$('btnApply').onclick = async () => {
  const propKeys = getSelectedPropKeys();
  const wantPopup = $('outPopup').checked;
  const wantLabel = $('outLabel').checked;
  const wantNivel = $('outNivel').checked;
  if (!wantPopup && !wantLabel && !wantNivel) { log('Selecione ao menos um tipo de saída.', true); return; }
  if ((wantPopup || wantLabel) && !propKeys.length) { log('Selecione ao menos uma propriedade.', true); return; }

  const feats = await readSelection();
  updateSelStatus(feats);
  if (!feats.length) { log('Nenhuma geometria selecionada no mapa.', true); return; }

  log(`Processando ${feats.length} feature(s)...`);
  if (wantPopup) await applyPopups(feats, propKeys);
  if (wantLabel) await applyLabels(feats, propKeys);
  if (wantNivel) await applyNivelLabels(feats);
};

$('btnClear').onclick = async () => {
  try { await rpc.invoke('clearSDKPopup', []); } catch (e) {}
  const n = await deleteTaggedSections();
  log(`Limpeza concluída (${n} label(s) removidos, popup fechado).`);
};

/* =========================================================
   ATUALIZAR PONTOS — sincroniza valores sem mover geometria
   ========================================================= */
function getRawSectionFeatures() {
  let raw = giraffeState.get('rawSections');
  let feats = [];
  if (Array.isArray(raw)) feats = raw;
  else if (raw?.features) feats = raw.features;
  else if (raw && typeof raw === 'object') feats = Object.values(raw);
  return feats.filter(Boolean);
}

// Features AVALIADAS (com _height/_baseHeight calculados pelo engine —
// essenciais para elementos com stack order). A chave do giraffeState
// varia/não é documentada, então tentamos candidatas.
let evalSourceKey = null;
function getEvaluatedFeaturesMap() {
  const candidates = ['bakedSections', 'sections', 'evaluatedSections', 'projectSections', 'features'];
  const map = {};
  for (const key of candidates) {
    try {
      let raw = giraffeState.get(key);
      let feats = [];
      if (Array.isArray(raw)) feats = raw;
      else if (raw?.features) feats = raw.features;
      else if (raw && typeof raw === 'object') feats = Object.values(raw);
      feats = feats.filter((f) => f && f.properties);
      if (feats.length) {
        evalSourceKey = key;
        feats.forEach((f) => {
          const id = f.id || f.properties?.id;
          if (id) map[id] = f;
        });
        return map;
      }
    } catch (e) { /* chave inexistente — próxima */ }
  }
  return map;
}

/* =========================================================
   DESLOCAMENTO RELATIVO — o ponto segue o MOVIMENTO da origem
   em vez de "grudar" no centróide. Assim o deslocamento manual
   feito pelo usuário (ex.: arrastar o rótulo para um canto do
   edifício) é preservado: aplicamos ao ponto o mesmo vetor de
   translação que a origem sofreu desde a última sincronização.

   sp_srcAnchor guarda o centróide da origem na última sync.
   delta = centróide atual − sp_srcAnchor  →  soma-se ao ponto.
   Cobre translação; rotação/escala da origem não são rastreadas.
   ========================================================= */
const ANCHOR_EPS = 1e-12;

function followSource(pt, src) {
  const srcCentroid = centroid(src);
  const anchor = Array.isArray(pt.properties?.sp_srcAnchor) ? pt.properties.sp_srcAnchor : null;
  const cur = pt.geometry?.coordinates;

  // Sem centróide resolvível — nada a fazer
  if (!srcCentroid || !Array.isArray(cur)) {
    return { geometry: pt.geometry, anchor, geomChanged: false, anchorChanged: false };
  }

  // Ponto legado (criado antes do sp_srcAnchor): adota a posição atual
  // como referência e apenas grava a âncora — NÃO reposiciona.
  if (!anchor) {
    return { geometry: pt.geometry, anchor: srcCentroid, geomChanged: false, anchorChanged: true };
  }

  const dLng = srcCentroid[0] - anchor[0];
  const dLat = srcCentroid[1] - anchor[1];

  // Origem não se moveu — preserva a posição do ponto integralmente
  // (inclusive qualquer arraste manual que o usuário tenha feito)
  if (Math.abs(dLng) <= ANCHOR_EPS && Math.abs(dLat) <= ANCHOR_EPS) {
    return { geometry: pt.geometry, anchor, geomChanged: false, anchorChanged: false };
  }

  // Origem se moveu — aplica o MESMO delta ao ponto, mantendo o
  // deslocamento relativo (o rótulo continua no mesmo canto)
  return {
    geometry: { type: 'Point', coordinates: [cur[0] + dLng, cur[1] + dLat] },
    anchor: srcCentroid,
    geomChanged: true,
    anchorChanged: true,
  };
}

async function updatePoints(auto = false, scope = 'all') {
  // Lê direto de giraffeState.rawSections — inclui features em layers
  // ocultos (visibilidade é só de renderização, os dados continuam lá).
  const all = getRawSectionFeatures();

  // ─── SAÍDA ANTECIPADA: sem pontos do app, nada a avaliar ───
  // (feita ANTES das chamadas RPC caras — reduz a latência do auto-sync)
  let points = all.filter((f) => f?.properties?.sp_tag === SP_TAG);
  if (!points.length) {
    if (!auto) log('Nenhum ponto do app encontrado para atualizar.', true);
    return;
  }

  // Índice de features por id (candidatas a origem)
  const byId = {};
  all.forEach((f) => {
    const id = f.id || f.properties?.id;
    if (id) byId[id] = f;
  });

  // Seleção atual — lida UMA vez e reaproveitada (era chamada 2×)
  const selFeats = await readSelection();
  const selMap = {};
  selFeats.forEach((f) => {
    const id = f.id || f.properties?.id;
    if (id) selMap[id] = f;
  });

  // Escopo "selecionados": pontos vinculados aos elementos selecionados
  // OU os próprios pontos selecionados no mapa
  if (scope === 'selected') {
    const selIds = new Set(Object.keys(selMap));
    if (!selIds.size) { log('Nada selecionado no mapa.', true); return; }
    points = points.filter((pt) => {
      const ptId = pt.id || pt.properties?.id;
      return selIds.has(pt.properties.sp_source) || selIds.has(ptId);
    });
    if (!points.length) { log('Nenhum ponto do app vinculado à seleção atual.', true); return; }
  }

  // Fontes AVALIADAS (com _height/_baseHeight de stack):
  // 1. giraffeState com chaves candidatas (varia por versão do SDK)
  // 2. rpc.invoke('evaluateFeatures') — API documentada, avalia raw no momento
  // 3. Seleção atual via getSelectedFeatures (sempre avaliada)
  const evalMap = getEvaluatedFeaturesMap();

  // Fonte 2: evaluateFeatures — avalia os raw sem precisar de seleção.
  // Essencial para o auto-sync quando o usuário move sem selecionar.
  // OTIMIZAÇÃO: avalia SÓ as origens realmente vinculadas a pontos,
  // não o projeto inteiro — corta muito da latência em projetos grandes.
  const neededIds = new Set(
    points.map((pt) => pt.properties?.sp_source).filter(Boolean)
  );
  const missingEval = [...neededIds].filter((id) => !evalMap[id] && !selMap[id] && byId[id]);
  if (missingEval.length) {
    try {
      const rawFeats = missingEval.map((id) => byId[id]);
      const evaluated = await rpc.invoke('evaluateFeatures', [rawFeats]);
      if (evaluated && typeof evaluated === 'object') {
        const feats = Array.isArray(evaluated) ? evaluated
          : evaluated.features ? evaluated.features
          : Object.values(evaluated);
        feats.forEach((f) => {
          if (!f) return;
          const id = f.id || f.properties?.id;
          if (id && !evalMap[id]) { evalMap[id] = f; evalSourceKey = 'evaluateFeatures'; }
        });
      }
    } catch (e) { /* evaluateFeatures indisponível nesta versão — ignorar */ }
  }

  const resolveSrc = (id) => evalMap[id] || selMap[id] || byId[id] || null;
  if (!auto) {
    log(evalSourceKey
      ? `Fonte avaliada: '${evalSourceKey}'.`
      : 'Fonte avaliada indisponível — elementos com stack podem usar valores raw (selecione-os no mapa antes de atualizar para garantir cotas corretas).');
  }

  // Modo de propriedades: originais da criação ou as marcadas no app agora
  const useAppProps =
    document.querySelector('input[name="updMode"]:checked')?.value === 'app';
  const appPropKeys = getSelectedPropKeys();

  const toUpdate = [];
  let orphans = 0;
  let skippedStack = 0;

  for (const pt of points) {
    const srcId = pt.properties.sp_source;
    const propKeys = useAppProps ? appPropKeys : (pt.properties.sp_props || []);
    const src = srcId ? resolveSrc(srcId) : null;
    const srcIsEvaluated = !!(evalMap[srcId] || selMap[srcId]);

    if (!src) {
      orphans++;
      if (!auto) log(`Ponto ${pt.properties.name || pt.id}: origem ${srcId || '?'} não encontrada (órfão).`, true);
      continue;
    }

    // PROTEÇÃO: elemento com stack order sem fonte avaliada — o recálculo
    // raw daria cota errada e SOBRESCREVERIA um valor correto. Pular
    // APENAS no modo manual; no auto-sync, geometria (XY) muda mas a
    // elevação do ponto não é recalculada, então deixamos passar para
    // sincronizar a posição horizontal (geometry segue o centroide do raw).
    if (!srcIsEvaluated && src.properties?.stackOrder !== undefined && !auto) {
      skippedStack++;
      continue;
    }

    // ─── RÓTULO DE NÍVEL: regenera o SVG quando o valor/elevação/posição muda ───
    if (pt.properties.sp_kind === 'nivel') {
      const nv = (await resolveProps(src, ['nivelDoTopo'])).nivelDoTopo;
      const topElevN = srcIsEvaluated
        ? ((await resolveProps(src, ['height'])).height || 0)
        : pt.properties.baseHeight;  // preserva cota quando não avaliado
      const nvChanged = nv !== null && pt.properties.kv_nivelDoTopo !== nv;
      const elevChangedN =
        pt.properties.baseHeight !== topElevN || pt.properties._baseHeight !== topElevN;

      // Segue o deslocamento da origem preservando o arraste manual
      const followN = followSource(pt, src);

      if (!nvChanged && !elevChangedN && !followN.geomChanged && !followN.anchorChanged) continue;

      let pngUrlUpd;
      const ptMode = pt.properties.sp_view || '3d';
      try {
        pngUrlUpd = nv !== null
          ? await nivelPngDataUri(fmtBR(nv), ptMode)
          : pt.properties.marker?.value?.spriteUrl;  // mantém sprite se nv não mudou
      } catch (e) {
        log('Rasterização do símbolo falhou no update: ' + e.message, true);
        continue;
      }
      toUpdate.push({
        ...pt,
        geometry: followN.geometry,
        properties: {
          ...pt.properties,
          kv_nivelDoTopo: nv !== null ? nv : pt.properties.kv_nivelDoTopo,
          baseHeight: topElevN,
          _baseHeight: topElevN,
          sp_srcAnchor: followN.anchor,
          marker: {
            ...pt.properties.marker,
            value: {
              ...(pt.properties.marker?.value || {}),
              spriteUrl: pngUrlUpd,
            },
          },
        },
      });
      continue;
    }

    // Recalcula os valores (com fallbacks de calculadas) a partir da origem
    const values = await resolveProps(src, propKeys);
    const { copiedProps } = templateFromValues(values);

    // Elevação: o ponto acompanha o topo atual do elemento (topHeight).
    // Se srcIsEvaluated, usa a cota avaliada; se não, preserva a existente
    // (evita sobrescrever com valor raw incorreto em elementos com stack).
    const topElev = srcIsEvaluated
      ? ((await resolveProps(src, ['height'])).height || 0)
      : pt.properties.baseHeight;  // preserva cota existente quando não avaliado
    const elevChanged =
      pt.properties.baseHeight !== topElev || pt.properties._baseHeight !== topElev;

    // Geometria: o ponto segue o DESLOCAMENTO da origem, preservando
    // qualquer reposicionamento manual (o rótulo fica no mesmo canto).
    const follow = followSource(pt, src);
    const newGeometry = follow.geometry;
    const geomChanged = follow.geomChanged;
    const anchorChanged = follow.anchorChanged;

    // TEXTO: respeita edições manuais no elemento. Como o texto usa
    // templates {{get(properties,'kv_X')}}, os VALORES exibidos atualizam
    // sozinhos quando as chaves kv_ mudam — só reescrevemos o texto se o
    // CONJUNTO de propriedades mudou. E mesmo aí, preservamos a ordem das
    // linhas existentes e anexamos as novas ao final.
    const currentText = pt.properties.marker?.value?.text || '';
    const requiredKeys = new Set(Object.keys(copiedProps).map((k) => k.replace(/^kv_/, '')));
    const currentKeys = new Set(
      [...currentText.matchAll(/kv_([A-Za-z0-9_]+)/g)].map((m) => m[1])
    );
    let newText = currentText;
    const sameKeys =
      currentKeys.size === requiredKeys.size &&
      [...requiredKeys].every((k) => currentKeys.has(k));
    if (!sameKeys) {
      const keptLines = currentText.split('\n').filter((line) => {
        const m = line.match(/kv_([A-Za-z0-9_]+)/);
        return m && requiredKeys.has(m[1]);
      });
      const presentKeys = new Set(
        keptLines.map((l) => l.match(/kv_([A-Za-z0-9_]+)/)[1])
      );
      const newLines = [...requiredKeys]
        .filter((k) => !presentKeys.has(k))
        .map((k) => `${PROP_PT[k] || k}: {{get(properties, 'kv_${k}')}}`);
      newText = [...keptLines, ...newLines].join('\n');
    }

    // DIFF: só atualiza se algo realmente mudou — isso também impede o
    // loop do listener (nossa própria escrita gera diff vazio na volta).
    const valuesChanged = Object.entries(copiedProps)
      .some(([k, v]) => pt.properties[k] !== v);
    const textChanged = newText !== currentText;
    if (!valuesChanged && !textChanged && !elevChanged && !geomChanged && !anchorChanged) continue;

    // Atualiza geometria (delta da origem), elevação, valores kv_ e texto.
    const updated = {
      ...pt,
      geometry: newGeometry,
      properties: {
        ...pt.properties,
        ...copiedProps,
        baseHeight: topElev,
        _baseHeight: topElev,
        sp_srcAnchor: follow.anchor,
        ...(useAppProps ? { sp_props: propKeys } : {}),
        marker: {
          ...pt.properties.marker,
          value: {
            ...(pt.properties.marker?.value || {}),
            text: newText,
          },
        },
      },
    };
    toUpdate.push(updated);
  }

  if (!toUpdate.length) {
    if (!auto) {
      let msg = 'Nada a atualizar — valores já estão sincronizados.';
      if (orphans) msg += ` (${orphans} órfão(s))`;
      if (skippedStack) msg += ` ${skippedStack} ponto(s) de elementos com stack pulados — selecione esses elementos no mapa e atualize de novo para usar as cotas avaliadas.`;
      log(msg);
    }
    return;
  }

  try {
    isSelfWriting = true;
    await rpc.invoke('updateRawSections', [toUpdate]);
    const layers = [...new Set(toUpdate.map((f) => f.properties.layerId || '?'))].join(', ');
    log(`${auto ? '[auto] ' : ''}${toUpdate.length} ponto(s) atualizado(s) — posições e layers preservados (${layers}).` +
      (orphans && !auto ? ` ${orphans} órfão(s) ignorados.` : '') +
      (skippedStack && !auto ? ` ${skippedStack} com stack pulados (sem fonte avaliada — selecione-os e atualize).` : ''));
  } catch (e) {
    log('updateRawSections falhou: ' + e.message, true);
  } finally {
    // Libera a flag após o eco do listener (a escrita dispara rawSections)
    releaseSelfWriting();
  }
}

/* =========================================================
   SINCRONIZAÇÃO AUTOMÁTICA — listener em rawSections
   ========================================================= */
let isSelfWriting = false;
let syncTimer = null;
let pendingSync = false;   // evento chegou durante nossa escrita — não perder
let syncRunning = false;   // impede execuções concorrentes de updatePoints

const SYNC_DEBOUNCE = 220;      // resposta mais fluida (era 800ms)
const SELF_WRITE_WINDOW = 900;  // janela do eco da própria escrita

// Agenda uma sincronização com debounce curto
function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, SYNC_DEBOUNCE);
}

// Executa a sincronização em série; se chegou pedido durante a execução,
// roda de novo ao terminar (não perde a última mudança do usuário).
async function runSync() {
  if (syncRunning) { pendingSync = true; return; }
  syncRunning = true;
  try {
    await updatePoints(true);
  } catch (e) {
    log('Auto-sync: ' + e.message, true);
  } finally {
    syncRunning = false;
    if (pendingSync) { pendingSync = false; scheduleSync(); }
  }
}

// Libera a flag de auto-escrita e, se houve evento represado nesse
// intervalo, dispara a sincronização — antes esses eventos eram
// simplesmente descartados (causa das falhas intermitentes).
function releaseSelfWriting(delay = SELF_WRITE_WINDOW) {
  setTimeout(() => {
    isSelfWriting = false;
    if (pendingSync) { pendingSync = false; scheduleSync(); }
  }, delay);
}

function setupAutoSync() {
  const chk = $('autoSync');
  chk.checked = localStorage.getItem('kv_annot_autosync') === '1';
  chk.onchange = () => {
    localStorage.setItem('kv_annot_autosync', chk.checked ? '1' : '0');
    log('Sincronização automática ' + (chk.checked ? 'ATIVADA' : 'desativada') + '.');
  };

  try {
    giraffeState.addListener(['rawSections'], () => {
      if (!$('autoSync').checked) return;
      // Eco da nossa própria escrita: NÃO descarta — represa para rodar
      // assim que a janela fechar. Sem isso, mudanças feitas logo após
      // uma sincronização eram silenciosamente ignoradas.
      if (isSelfWriting) { pendingSync = true; return; }
      scheduleSync();
    });
    log('Listener de rawSections registrado (auto-sync).');
  } catch (e) {
    log('Falha ao registrar listener de rawSections: ' + e.message, true);
  }

  // Mudança na cota base também dispara sincronização (Nível da Base/Topo)
  $('seaLevel').addEventListener('input', () => {
    if (!$('autoSync').checked) return;
    scheduleSync();
  });
}

/* =========================================================
   DIAGNÓSTICO DA DETECÇÃO DE VISTA
   Despeja no log tudo que o SDK expõe sobre a câmera. Serve para
   calibrar a detecção Auto quando o pitch não está em chave conhecida.
   ========================================================= */

// Busca profunda por qualquer sinal de câmera, retornando os CAMINHOS
function findCameraSignals(v, path = '', depth = 0, seen = new Set(), hits = []) {
  if (v == null || depth > 5 || typeof v !== 'object') return hits;
  if (seen.has(v)) return hits;
  seen.add(v);
  if (Array.isArray(v)) {
    if (v.length > 30) return hits;
    v.forEach((item, i) => findCameraSignals(item, `${path}[${i}]`, depth + 1, seen, hits));
    return hits;
  }
  for (const [k, val] of Object.entries(v)) {
    if (HEAVY_KEYS.has(k)) continue;
    const p = path ? `${path}.${k}` : k;
    const lk = k.toLowerCase();
    if (typeof val === 'number' && ['pitch', 'bearing', 'zoom', 'rotation', 'tilt'].includes(lk)) {
      hits.push(`${p} = ${val}`);
    } else if (typeof val === 'boolean' && (lk.includes('3d') || lk.includes('2d') || lk.includes('perspective') || lk.includes('plan'))) {
      hits.push(`${p} = ${val}`);
    } else if (typeof val === 'string' && (lk.includes('mode') || lk.includes('view')) && val.length < 24) {
      hits.push(`${p} = "${val}"`);
    } else {
      findCameraSignals(val, p, depth + 1, seen, hits);
    }
  }
  return hits;
}

$('btnDiagView').onclick = async () => {
  log('══════ DIAGNÓSTICO DE VISTA (varredura ampla) ══════');
  log(`modo atual: ${currentViewMode.toUpperCase()} | seletor: ${symbolModeSetting()}`);

  // ── 1. Varredura ampla de chaves do giraffeState ──
  // Lista abrangente: chaves documentadas + variações plausíveis.
  const PROBE_KEYS = [
    'mapView', 'mapContent', 'mapStyle', 'mapState', 'mapCamera', 'mapPitch',
    'camera', 'cameraPosition', 'view', 'views', 'viewState', 'viewport',
    'activeView', 'currentView', 'projectView', 'viewMode', 'mapMode',
    'is3d', 'is3D', 'threeD', 'perspective', 'planView',
    'project', 'projectBundle', 'projectSettings', 'appState', 'uiState',
    'selected', 'selectedFeatures', 'mapSelectCoord', 'mapHoverCoords',
    'projectLayers', 'layers', 'layerTree', 'drawingLayers',
    'usages', 'flows', 'scenarios', 'activeScenario', 'drawTool',
    'isolateMode', 'settings', 'preferences', 'renderSettings',
    'sunPosition', 'solar', 'terrain', 'zoom', 'bearing', 'pitch',
  ];

  const existing = [];
  for (const key of PROBE_KEYS) {
    let v;
    try { v = giraffeState.get(key); } catch (e) { continue; }
    if (v === undefined || v === null) continue;
    existing.push(key);
  }
  log(`chaves COM valor (${existing.length}): ${existing.join(', ') || 'nenhuma'}`);

  // ── 2. Conteúdo de cada chave existente ──
  for (const key of existing) {
    let v;
    try { v = giraffeState.get(key); } catch (e) { continue; }
    if (typeof v !== 'object') {
      log(`  [${key}] (${typeof v}) = ${String(v).slice(0, 120)}`);
      continue;
    }
    if (Array.isArray(v)) {
      log(`  [${key}] array(${v.length})${v.length && typeof v[0] === 'object' ? ' — chaves do [0]: ' + Object.keys(v[0]).slice(0, 25).join(',') : ''}`);
      continue;
    }
    const ks = Object.keys(v);
    log(`  [${key}] objeto — chaves (${ks.length}): ${ks.slice(0, 40).join(', ')}`);
    // Dump completo se for pequeno (candidato forte a objeto de câmera)
    if (ks.length <= 20) {
      let s;
      try { s = JSON.stringify(v); } catch (e) { s = '[circular]'; }
      if (s && s.length <= 700) log(`     valor: ${s}`);
    }
    const hits = findCameraSignals(v);
    if (hits.length) log(`     ⇒ SINAIS: ${hits.slice(0, 15).join(' | ')}`);
  }

  // ── 3. Varredura de RPCs que possam expor a câmera ──
  const PROBE_RPCS = [
    'getMapCamera', 'getCamera', 'getCameraPosition', 'getMapPitch',
    'getMapZoom', 'getMapCenter', 'getMapBearing', 'getMapState',
    'getViewport', 'getView', 'getCurrentView', 'getMapTransform',
    'getMapCanvas', 'getMapSize', 'getMap',
  ];
  const okRpc = [];
  for (const fn of PROBE_RPCS) {
    try {
      const r = await rpc.invoke(fn, []);
      if (r === undefined) continue;
      let s;
      try { s = JSON.stringify(r); } catch (e) { s = String(r); }
      okRpc.push(fn);
      log(`  rpc ${fn}() → ${(s || String(r)).slice(0, 400)}`);
    } catch (e) { /* função inexistente — silencioso */ }
  }
  if (!okRpc.length) log('  nenhum RPC de câmera respondeu.');

  // ── 4. Referência: bounds + zoom (para heurística, se necessário) ──
  try {
    const res = await rpc.invoke('getMapBounds', []);
    const ring = ringFromBounds(res);
    const mv = giraffeState.get('mapView');
    const zoom = typeof mv?.zoom === 'number' ? mv.zoom : null;
    if (ring && zoom !== null) {
      const lat0 = ring.reduce((s, p) => s + p[1], 0) / ring.length;
      const lngs = ring.map((p) => p[0]), lats = ring.map((p) => p[1]);
      const dx = (Math.max(...lngs) - Math.min(...lngs)) * 111320 * Math.cos((lat0 * Math.PI) / 180);
      const dy = (Math.max(...lats) - Math.min(...lats)) * 110574;
      const resM = (156543.03392 * Math.cos((lat0 * Math.PI) / 180)) / Math.pow(2, zoom);
      log(`  bbox: ${dx.toFixed(1)}m × ${dy.toFixed(1)}m | zoom ${zoom.toFixed(3)} | m/px ${resM.toFixed(4)}`);
      log(`  bbox em px equivalentes: ${(dx / resM).toFixed(0)} × ${(dy / resM).toFixed(0)} (área ${((dx / resM) * (dy / resM) / 1000).toFixed(0)}k px²)`);
    }
  } catch (e) { /* ignorar */ }

  log('══════ FIM ══════');
};
